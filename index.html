<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RODポータル</title>
<!-- iPhone ホーム画面用 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RODポータル">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Android / PC 用 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#231917">
<style>
  :root{
    --dark:#231917; --orange:#D87D3C; --red:#DB5426; --cream:#FFF8EE;
    --card:#ffffff; --text:#231917; --sub:#7a6a64;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--cream); color:var(--text); min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    position:relative; overflow:hidden;
    background:var(--dark); color:#fff;
    padding:calc(env(safe-area-inset-top) + 28px) 20px 26px;
  }
  header::before,header::after{
    content:""; position:absolute; top:0; bottom:0; width:70px; transform:skewX(-20deg);
  }
  header::before{right:120px; background:var(--red); opacity:.9}
  header::after{right:30px; background:var(--orange); opacity:.9}
  .head-inner{position:relative; z-index:1; display:flex; align-items:center; gap:14px; max-width:720px; margin:0 auto}
  .head-inner .mark{height:46px; background:#fff; border-radius:10px; padding:5px 7px}
  .head-inner h1{font-size:22px; letter-spacing:.06em}
  .head-inner p{font-size:12px; opacity:.75; margin-top:2px}
  .lion{position:absolute; z-index:2; right:14px; bottom:-6px; height:96px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  main{max-width:720px; margin:0 auto; padding:22px 16px 40px}
  .grid{display:grid; grid-template-columns:1fr; gap:14px}
  @media (min-width:640px){ .grid{grid-template-columns:1fr 1fr} }
  a.tile{
    display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
    background:var(--card); border-radius:16px; padding:18px;
    box-shadow:0 1px 2px rgba(35,25,23,.08),0 4px 14px rgba(35,25,23,.06);
    border-left:6px solid var(--orange);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.tile:active{transform:scale(.98)}
  @media (hover:hover){ a.tile:hover{transform:translateY(-2px); box-shadow:0 2px 4px rgba(35,25,23,.1),0 10px 24px rgba(35,25,23,.1)} }
  .ico{flex:0 0 52px; height:52px; border-radius:14px; display:grid; place-items:center; color:#fff}
  .ico svg{width:28px; height:28px}
  .tile h2{font-size:17px}
  .tile p{font-size:12.5px; color:var(--sub); margin-top:3px; line-height:1.5}
  .arrow{margin-left:auto; color:#c9b8b0; font-size:22px}
  footer{text-align:center; font-size:11px; color:var(--sub); padding:10px 0 calc(env(safe-area-inset-bottom) + 20px)}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <img class="mark" src="logo-mark.png" alt="ROD">
    <div>
      <h1>RODポータル</h1>
      <p>業務アプリの入口</p>
    </div>
  </div>
  <img class="lion" src="lion.png" alt="">
</header>

<main>
  <div class="grid" id="grid"></div>
</main>
<footer>© ROD Co.,Ltd.</footer>

<script>
  // ▼ アプリを増やすときは、ここに1行（{ ... },）を足すだけでOKです
  const APPS = [
    {
      name: "ジャイロ貸出ボード",
      desc: "返却・開始・在庫・代車・保険加入のカレンダー",
      url:  "https://claude.ai/code/artifact/86691f0c-9588-479a-9f57-5dacd739b281",
      color:"#DB5426", icon:"calendar"
    },
    {
      name: "整備記録",
      desc: "車両ごとの整備内容を記録・確認",
      url:  "https://script.google.com/macros/s/AKfycbzobUtZ3nPrUSRq3ix-c3MaGl9BrW4j69l45DJn2WnvMM3m1l9UY09CQLUKxPnFvP33_g/exec",
      color:"#D87D3C", icon:"wrench"
    },
    {
      name: "マスタ検索",
      desc: "顧客・車両マスタをすばやく検索",
      url:  "https://script.google.com/macros/s/AKfycbyBB397j8UM6NDbtELqAmKv0vLJzl5-hjAtiZCmpQjlMbj7tEosMqvx0iuWybmkYXEuvw/exec",
      color:"#231917", icon:"search"
    }
  ];

  const ICONS = {
    calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
    app:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>'
  };

  const grid = document.getElementById("grid");
  APPS.forEach(a => {
    const el = document.createElement("a");
    el.className = "tile";
    el.href = a.url;
    el.target = "_blank";          // 別画面で開く（iPhoneは「完了」でポータルに戻れます）
    el.rel = "noopener";
    el.style.borderLeftColor = a.color;
    el.innerHTML =
      '<div class="ico" style="background:'+a.color+'">'+(ICONS[a.icon]||ICONS.app)+'</div>'+
      '<div><h2>'+a.name+'</h2><p>'+a.desc+'</p></div>'+
      '<span class="arrow">›</span>';
    grid.appendChild(el);
  });
</script>
</body>
</html>
